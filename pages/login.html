<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/toast.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="login-container">
        <form class="form">
            <header class="form-header">
                <h3 class="title">Đăng nhập</h3>
                <p class="description">
                    Đăng nhập tài khoản để sử dụng hệ thống quản lý.
                </p>
                <p class="description-mobile">
                    Đăng nhập tài khoản để sử dụng dịch vụ
                </p>
            </header>
            <main class="form-body">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" name="email" id="email" autocomplete="email" />
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input class="form-input" type="password" name="password" id="password" />
                    <small class="error-message"></small>
                </div>
            </main>

            <div class="form-function">
                <div class="remember-account">
                    <input class="input-checkbox" type="checkbox" />
                    <span>Nhớ tài khoản</span>
                </div>
                <div class="forgot-account">
                    <a href="">Quên mật khẩu</a>
                </div>
            </div>
            <div class="form-function-mobile">
                <div class="agree-policies">
                    <input class="input-checkbox" type="checkbox" />
                </div>
                <div class="agree-policies-text">
                    <span>Bạn đồng ý với</span>
                    <sapn class="agree-policies-text-link">chính sách và điều khoản</sapn>
                </div>
            </div>

            <footer class="form-footer">
                <button class="form-button">
                    Đăng nhập
                </button>
                <p class="form-redirect">
                    <span>Bạn chưa có tài khoản?
                        <a href="./register.html">Đăng ký</a></span>
                </p>
            </footer>
        </form>
    </div>
    <div id="toast-container"></div>
</body>
<script src="../js/login.js"></script>

</html>
